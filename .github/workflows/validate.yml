name: Validate statistics course

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Build notebooks from their authored sources
        run: python scripts/build_notebooks.py
      - name: Execute every notebook and validate the course
        run: python scripts/validate_course.py --execute
