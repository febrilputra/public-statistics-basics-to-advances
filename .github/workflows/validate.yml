name: Check notes and figures

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Regenerate the chapter 14-18 figures
        run: for f in 1[4-8]_*/figures/make_figures.py; do python "$f"; done
      - name: Check local links and figures
        run: python scripts/check_links.py
