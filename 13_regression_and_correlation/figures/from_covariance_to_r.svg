<text x="175.0" y="382.0" font-size="12.5" fill="#1F4E79" text-anchor="middle" font-weight="bold">cov = 8.5</text>
<text x="175.0" y="401.0" font-size="12" fill="#555555" text-anchor="middle">sₓ = 2.550,  sᵧ = 3.391</text>
<text x="175.0" y="420.0" font-size="12.5" fill="#1F4E79" text-anchor="middle" font-weight="bold">r = 8.5 / (2.550 × 3.391) = 0.983</text>
<text x="495.0" y="382.0" font-size="12.5" fill="#D55E00" text-anchor="middle" font-weight="bold">cov = 85</text>
<text x="495.0" y="401.0" font-size="12" fill="#555555" text-anchor="middle">sₓ = 2.550,  sᵧ = 33.912</text>
<text x="495.0" y="420.0" font-size="12.5" fill="#D55E00" text-anchor="middle" font-weight="bold">r = 85 / (2.550 × 33.912) = 0.983</text>
<text x="815.0" y="382.0" font-size="12.5" fill="#009E73" text-anchor="middle" font-weight="bold">cov of the z-scores = 0.983</text>
<text x="815.0" y="401.0" font-size="12" fill="#555555" text-anchor="middle">both SDs are now 1</text>
<text x="815.0" y="420.0" font-size="12.5" fill="#009E73" text-anchor="middle" font-weight="bold">so r = 0.983 directly</text>
<line x1="335.0" y1="85.0" x2="335.0" y2="428.0" stroke="#E1E4E8" stroke-width="1"/>
<line x1="655.0" y1="85.0" x2="655.0" y2="428.0" stroke="#E1E4E8" stroke-width="1"/>
<rect x="60.0" y="440.0" width="880.0" height="78.0" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
<text x="500.0" y="465.0" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="bold">r = cov(x, y) / (sₓ sᵧ) = Σ zₓ zᵧ / (n − 1): the average product of z-scores.</text>
<text x="500.0" y="489.0" font-size="12.5" fill="#555555" text-anchor="middle">Units of cov = (units of x)(units of y) = units of sₓsᵧ, so they cancel. r always stays between −1 and +1.</text>
