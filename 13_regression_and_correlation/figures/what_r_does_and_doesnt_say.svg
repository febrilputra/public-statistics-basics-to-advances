<text x="500.0" y="426.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">r² = the share of the variation in y that the line explains</text>
<text x="500.0" y="450.0" font-size="12.5" fill="#555555" text-anchor="middle">Lesson example: r = 0.998, so r² ≈ 0.996. The line explains about 99.6% of the ups and downs in y.</text>
<text x="500.0" y="474.0" font-size="12.5" fill="#555555" text-anchor="middle">And always: correlation is not causation. A strong r says the variables move together, not why.</text>
