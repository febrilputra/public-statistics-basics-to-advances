<text x="500.0" y="457.0" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="bold">Variance (Lesson 3.13) averages squares (x − x̄)(x − x̄). Covariance swaps one factor for (y − ȳ): cov(x, x) = var(x).</text>
<text x="500.0" y="481.0" font-size="12.5" fill="#555555" text-anchor="middle">The size depends on units: measure y in cm instead of m and cov is 100 times bigger. Lesson 13.4 fixes that with r.</text>
